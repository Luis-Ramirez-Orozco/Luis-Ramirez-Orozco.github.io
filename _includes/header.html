<header class="site-header" role="banner">
  <div class="wrapper" style="position:relative;">

    <button id="menu-btn" aria-label="Open navigation menu" aria-expanded="false"
      style="position:fixed; top:14px; left:14px; z-index:1001; width:40px; height:40px;
             border:none; border-radius:8px; background:#3b5bdb; cursor:pointer;">
      <span style="display:block; width:20px; height:2px; background:white; margin:5px auto;"></span>
      <span style="display:block; width:20px; height:2px; background:white; margin:5px auto;"></span>
      <span style="display:block; width:20px; height:2px; background:white; margin:5px auto;"></span>
    </button>

    <nav id="side-nav" style="position:fixed; top:0; left:0; height:100%; width:230px;
             background:#1a1a1a; padding-top:80px; transform:translateX(-100%);
             transition:transform 0.25s ease; z-index:1000;">
      <a href="/" style="display:block; color:white; padding:12px 24px; text-decoration:none; font-family:Trebuchet MS;">Home</a>
      <a href="/#projects" style="display:block; color:white; padding:12px 24px; text-decoration:none; font-family:Trebuchet MS;">Projects</a>
      <a href="/fidget-clicker" style="display:block; color:#ccc; padding:8px 24px 8px 40px; text-decoration:none; font-family:Trebuchet MS; font-size:14px;">Fidget Clicker</a>
      <a href="/Pool-Table" style="display:block; color:#ccc; padding:8px 24px 8px 40px; text-decoration:none; font-family:Trebuchet MS; font-size:14px;">Pool Table</a>
    </nav>

  </div>
</header>

<script>
  document.getElementById('menu-btn').addEventListener('click', function () {
    var nav = document.getElementById('side-nav');
    var open = nav.style.transform === 'translateX(0px)';
    nav.style.transform = open ? 'translateX(-100%)' : 'translateX(0px)';
    this.setAttribute('aria-expanded', String(!open));
  });
</script>
