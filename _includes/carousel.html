{% assign carousel_images = include.images | split: "|" %}
<div id="{{ include.id }}-carousel" style="max-width:900px; margin:24px auto;">

  <div style="position:relative; border-radius:16px; overflow:hidden; box-shadow:0 4px 16px rgba(0,0,0,0.15); background:#f0f0f0;">
    <img id="{{ include.id }}-main" src="{{ include.folder }}/{{ carousel_images[0] }}"
         style="width:100%; max-height:600px; object-fit:contain; display:block;">
    <video id="{{ include.id }}-video" controls playsinline muted
           style="width:100%; max-height:600px; object-fit:contain; display:none; background:#000;"></video>

    <button onclick="moveCarousel('{{ include.id }}', -1)" aria-label="Previous item"
      style="position:absolute; top:50%; left:12px; transform:translateY(-50%); width:40px; height:40px; border:none; border-radius:50%; background:rgba(0,0,0,0.5); color:white; font-size:20px; cursor:pointer;">‹</button>
    <button onclick="moveCarousel('{{ include.id }}', 1)" aria-label="Next item"
      style="position:absolute; top:50%; right:12px; transform:translateY(-50%); width:40px; height:40px; border:none; border-radius:50%; background:rgba(0,0,0,0.5); color:white; font-size:20px; cursor:pointer;">›</button>
  </div>

  <div style="display:flex; justify-content:center; align-items:center; gap:8px; margin-top:16px;">
    {% for img in carousel_images %}
    <button class="{{ include.id }}-dot" onclick="jumpCarousel('{{ include.id }}', {{ forloop.index0 }})"
      aria-label="Go to item {{ forloop.index }}"
      style="height:8px; width:{% if forloop.first %}28px{% else %}8px{% endif %}; border-radius:999px; border:none; padding:0; cursor:pointer;
             background:{% if forloop.first %}#3b5bdb{% else %}#ccc{% endif %}; transition: width 0.25s ease, background 0.25s ease;"></button>
    {% endfor %}
  </div>

</div>

<script>
  window.carouselState = window.carouselState || {};
  window.carouselState["{{ include.id }}"] = {
    images: {{ carousel_images | jsonify }},
    folder: "{{ include.folder }}",
    index: 0
  };

  function isVideoFile(filename) {
    var videoExts = ['mov', 'mp4', 'm4v', 'webm', 'ogv'];
    var ext = filename.split('.').pop().toLowerCase();
    return videoExts.indexOf(ext) !== -1;
  }

function jumpCarousel(id, index) {
    var scrollY = window.scrollY;
    var state = window.carouselState[id];
    state.index = index;
    var file = state.images[index];
    var imgEl = document.getElementById(id + "-main");
    var videoEl = document.getElementById(id + "-video");

    videoEl.pause();

    if (isVideoFile(file)) {
      videoEl.src = state.folder + "/" + file;
      videoEl.style.display = "block";
      imgEl.style.display = "none";

      var restoreScroll = function () {
        window.scrollTo(0, scrollY);
        videoEl.removeEventListener("loadedmetadata", restoreScroll);
      };
      videoEl.addEventListener("loadedmetadata", restoreScroll);
      videoEl.play().catch(function(){
      });
    } else {
      imgEl.src = state.folder + "/" + file;
      imgEl.style.display = "block";
      videoEl.style.display = "none";
      videoEl.removeAttribute("src");
    }

    document.querySelectorAll("." + id + "-dot").forEach(function (dot, i) {
      dot.style.width = (i === index) ? "28px" : "8px";
      dot.style.background = (i === index) ? "#3b5bdb" : "#ccc";
    });

    window.scrollTo(0, scrollY);
  }

  function moveCarousel(id, direction) {
    var state = window.carouselState[id];
    var newIndex = (state.index + direction + state.images.length) % state.images.length;
    jumpCarousel(id, newIndex);
  }

  (function () {
    var wrap = document.getElementById("{{ include.id }}-carousel");
    var startX = null;
    wrap.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; });
    wrap.addEventListener('touchend', function (e) {
      if (startX === null) return;
      var delta = e.changedTouches[0].clientX - startX;
      if (delta > 50) moveCarousel("{{ include.id }}", -1);
      else if (delta < -50) moveCarousel("{{ include.id }}", 1);
      startX = null;
    });
  })();
</script>
